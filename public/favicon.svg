<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Icon Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#1e293b" stroke-width="2" />

  <!-- NYC Street Grid Texture in Background -->
  <g opacity="0.4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="36" x2="104" y2="36" />
    <line x1="24" y1="56" x2="104" y2="56" />
    <line x1="24" y1="76" x2="104" y2="76" />
    <line x1="24" y1="96" x2="104" y2="96" />
    <line x1="36" y1="24" x2="36" y2="104" />
    <line x1="56" y1="24" x2="56" y2="104" />
    <line x1="76" y1="24" x2="76" y2="104" />
    <line x1="96" y1="24" x2="96" y2="104" />
  </g>

  <!-- Hazard / NYC Yellow Warning Accent Bar at Bottom -->
  <g transform="translate(24, 98)">
    <rect width="80" height="10" rx="5" fill="#eab308" />
    <path d="M8 0L0 10H10L18 0H8ZM28 0L20 10H30L38 0H28ZM48 0L40 10H50L58 0H48ZM68 0L60 10H70L78 0H68Z" fill="#0f172a" opacity="0.75" />
  </g>

  <!-- Glowing Cyan Halo & Border for P Symbol -->
  <rect x="36" y="26" width="56" height="64" rx="14" fill="#0284c7" opacity="0.3" filter="url(#neonGlow)" />
  <rect x="36" y="26" width="56" height="64" rx="14" stroke="#38bdf8" stroke-width="3" fill="#0f172a" fill-opacity="0.8" />

  <!-- Bold White Parking "P" -->
  <path d="M48 76V40H66C72.6274 40 78 45.3726 78 52C78 58.6274 72.6274 64 66 64H56V76H48ZM56 48V56H65C67.2091 56 69 54.2091 69 52C69 49.7909 67.2091 48 65 48H56Z" fill="#ffffff" />
  
  <!-- Live Signal Status Dot (Top Right) -->
  <circle cx="102" cy="26" r="7" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="102" cy="26" r="3.5" fill="#ffffff" />
</svg>